# Builds and publishes a Tanba release when a version tag is pushed.
#
#   git tag v0.2.0
#   git push origin main --tags
#
# The repository is public, so the shipped app reads its releases without any
# credential and carries no secret. GITHUB_TOKEN below is only used to create
# the release, and it exists only for the duration of this job.

name: release

on:
  push:
    tags: ['v*']
  # The same build, started by hand. A release that failed halfway can be
  # redone without deleting and re-pushing a tag, which rewrites history for
  # anyone who already fetched it.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v'
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Work out the version
        shell: pwsh
        env:
          ASKED: ${{ inputs.version }}
        run: |
          $v = if ($env:ASKED) { $env:ASKED } else { $env:GITHUB_REF_NAME -replace '^v','' }
          "VER=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Перед сборкой релиза, а не после: сломанная версия не должна уезжать
      # на машины, откуда её снимать придётся руками и ногами.
      - name: Test
        run: dotnet test src/Tanba.Tests --nologo

      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Publish
        run: >
          dotnet publish src/Tanba/Tanba.csproj
          -c Release -r win-x64 --self-contained true
          -o build/publish
          /p:Version=${{ env.VER }}
          /p:TanbaUpdateRepo=https://github.com/${{ github.repository }}

      # Deltas are computed against whatever full packages are already in the
      # output folder, so the previous release has to be fetched first. The very
      # first release has nothing to fetch, hence continue-on-error.
      - name: Fetch the previous release for a delta
        continue-on-error: true
        run: >
          vpk download github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          -o build/releases

      # The icon has to be passed here as well as being embedded in the exe.
      # Velopack makes the installer and the shortcuts itself, and it has
      # nowhere else to take an icon from: without this they come out blank.
      - name: Pack
        run: >
          vpk pack
          -u Tanba
          -v ${{ env.VER }}
          -p build/publish
          -e Tanba.exe
          -o build/releases
          --packTitle Tanba
          --packAuthors "Amanbek Shaimardan"
          --icon assets/tanba.ico

      # vpk creates the release as a draft unless --publish is given.
      - name: Upload
        run: >
          vpk upload github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          -o build/releases
          --tag v${{ env.VER }}
          --releaseName ${{ env.VER }}
          --publish
