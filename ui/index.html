<!doctype html>
<html lang="ru" data-tanba="dark">
<head>
<meta charset="utf-8">
<title>Tanba, разбор</title>
<link rel="stylesheet" href="tanba.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
<symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></symbol>
<symbol id="i-image" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path d="M6 3v18l14-9Z"/></symbol>
<symbol id="i-doc" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8M16 13H8M16 17H8"/></symbol>
<symbol id="i-file" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></symbol>
<symbol id="i-chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
<symbol id="i-inbox" viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></symbol>
<symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></symbol>
<symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
</defs></svg>

<div class="app">

  <header class="top">
    <span class="brand">Tanba</span>
    <span class="sep"></span>
    <span class="muted">Разбор</span>
    <span class="dim" id="pending"></span>
    <span class="grow"></span>
    <span class="dim mono" id="statFiles"></span>
    <span class="dim mono" id="statSize"></span>
    <a class="btn btn-ghost" href="tags.html">Теги</a>
    <a class="btn btn-ghost" href="library.html">Библиотека</a>
    <button class="btn btn-ghost btn-icon" id="rescan" title="Пересканировать приём">
      <svg class="ic"><use href="#i-refresh"></use></svg>
    </button>
    <button class="btn btn-ghost btn-icon" id="theme" title="Светлая или тёмная тема">
      <svg class="ic"><use href="#i-sun"></use></svg>
    </button>
  </header>

  <div class="main">
    <aside class="side" id="side"></aside>
    <section class="files" id="files"></section>
  </div>

  <footer class="bar">
    <button class="btn btn-primary" id="fileBtn">
      <svg class="ic"><use href="#i-check"></use></svg>
      Разложить <span class="count" id="fileN">0</span>
    </button>
    <button class="btn btn-ghost" id="laterBtn" title="Убрать из приёма без тегов, попадут в «Неразобранное»">Отложить</button>
    <span class="grow"></span>
    <span class="dim" id="hint"></span>
  </footer>

</div>

<div class="toast" id="toast"></div>
<div class="drop" id="drop"><div class="zone">Отпусти, заберу в разбор</div></div>

<script src="app.js"></script>
<script src="dragout.js"></script>
</body>
</html>
