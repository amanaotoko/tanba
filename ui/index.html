<!doctype html>
<html lang="ru" data-tanba="dark">
<head>
<meta charset="utf-8">
<title>Tanba</title>
<script>
// Тема до стилей и до первого кадра: иначе окно моргнёт тёмным у того,
// кто выбрал светлую.
try { if (localStorage.getItem('tanba-theme') === 'light') document.documentElement.dataset.tanba = 'light'; } catch (e) { }
</script>
<link rel="stylesheet" href="tanba.css">
<link rel="stylesheet" href="library.css">
<style>
/* Оболочка: полоса заголовка сверху, под ней четыре живых экрана, из
   которых виден ровно один. Переключение вкладки это смена класса, а не
   загрузка: поэтому переключаться нечему мигать. */
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); }
.shell { display: grid; grid-template-rows: 40px 1fr; height: 100vh; }
/* Фон обязателен: пока кадр не загрузил документ, он прозрачен, и без
   заливки сквозь него светил бы белый холст. */
.views { position: relative; min-height: 0; background: var(--bg); }
.views iframe { position: absolute; inset: 0; width: 100%; height: 100%;
  border: 0; background: var(--bg); }
/* Спрятанный экран убираем видимостью, а не display: display сбрасывает
   прокрутку и заставляет пересчитывать раскладку при каждом возврате. */
.views iframe[hidden] { display: block; visibility: hidden; pointer-events: none; }
</style>
</head>
<body>

<div class="shell">
  <div id="chrome"></div>
  <div class="views" id="views"></div>
</div>

<script src="strings.js"></script>
<script src="i18n.js"></script>
<script src="shell.js"></script>
</body>
</html>
